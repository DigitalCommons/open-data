ORIGINAL_CSV = original.csv
# SRC_CSV_DIR = original-data
# TOP_OUTPUT_DIR = generated-data

###########################################
# Components of the URIs used in this dataset:
# Generated URIs will start with: $(URI_SCHEME)://$(URI_HOST)/$(URI_PATH_PREFIX)
# URI_SCHEME = https
URI_HOST = dev.lod.coop
URI_PATH_PREFIX = comn

ESSGLOBAL_URI = https://dev.lod.coop/essglobal/2.1/

###########################################
# Mapbox token for geocoding cache misses; the cache is cache/geocodes.csv
GEOCODER_API_KEY_PATH = services/mapbox/landexplorer.txt

###########################################
# Linked Data and triplestore deployment (not used by the converter)
DEPLOYMENT_SERVER = dev-2
DEPLOYMENT_WEBROOT = /home/carrot/public_html
DEPLOYMENT_WEB_USER = carrot
DEPLOYMENT_WEB_GROUP = carrot

VIRTUOSO_SERVER = dev-2
VIRTUOSO_ROOT_DATA_DIR = /var/tmp/virtuoso/BulkLoading/
SPARQL_ENDPOINT = http://dev-2.digitalcommons.coop:8890/sparql
VIRTUOSO_PASS_FILE = deployments/dev-2.digitalcommons.coop/virtuoso/dba.password
AUTO_LOAD_TRIPLETS = true
###########################################

# If this is false, only `pass` is used to look up passwords.
# Otherwise, the environment is checked first, then `pass`.
USE_ENV_PASSWORDS = true

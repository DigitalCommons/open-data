# Secrets the data sources read through se-open-data's PasswordStore. Each
# `path` is the value of a *_PATH setting in a source's conf file; the
# converters read it from the environment variable PASSWORD__<PATH> (path
# upper-cased, other characters as "_"). Shown on the Settings page.
geoapify:
  path: geoapifyAPI.txt
  name: Geoapify API key
  description: Geocodes addresses for most data sources.
  where: Geoapify dashboard https://myprojects.geoapify.com - open the project, then API keys.
mapbox:
  path: services/mapbox/landexplorer.txt
  name: Mapbox access token
  description: Geocodes addresses for Co-ops UK, NFCA, Co-Minnesota and the Powys Food Map.
  where: Mapbox account https://account.mapbox.com/access-tokens
limesurvey:
  path: people/nick/lime-survey.password
  name: LimeSurvey password
  description: >-
    Signs in to the Solidarity Economy Association's LimeQuery to download
    survey responses. The username is in each source's config.
  where: The team's shared password store (the LimeQuery account used for the SEA surveys).
airtable:
  path: accounts/airtable.com/data-factory-download.apikey
  name: Airtable token
  description: Downloads the Owned by Oxford directory from Airtable.
  where: >-
    Airtable (airtable.com/create/tokens): a personal access token with read
    access to the Owned by Oxford base.
